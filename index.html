<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>佐久間家ご飯マネージャー</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
    <div id="app">
        <!-- iOS Style Header -->
        <header class="navbar">
            <div class="navbar-title">佐久間家ご飯マネージャー</div>
        </header>

        <!-- Segmented Control for Fixed Role Switching -->
        <nav class="segmented-control-container">
            <div class="segmented-control">
                <button class="segment active" data-role="mother" id="tab-mother">一覧</button>
                <button class="segment" data-role="brother1" id="tab-brother1">かいり</button>
                <button class="segment" data-role="brother2" id="tab-brother2">いっけい</button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="content-area">
            <!-- Header for current mode -->
            <div class="view-header">
                <div class="section-title-group">
                    <h2 id="current-view-title">ご飯の予定一覧</h2>
                </div>
            </div>

            <!-- Date Navigation Bar (Weekly) -->
            <div class="date-selector-bar">
                <button id="prev-week-btn" class="date-nav-btn">&lsaquo;</button>
                <span id="current-week-label" class="period-label">今週</span>
                <button id="next-week-btn" class="date-nav-btn">&rsaquo;</button>
            </div>

            <!-- 1-Week Cards Container -->
            <div id="week-cards-container" class="week-cards-list">
                <!-- Dynamic rendering -->
            </div>

            <!-- Gift Button Area (Shown at bottom for Mother view) -->
            <div id="gift-button-container" class="gift-button-container">
                <a href="https://shopping.yahoo.co.jp/search/%E3%83%97%E3%83%AC%E3%82%BC%E3%83%B3%E3%83%88+%E6%AF%8D/0/?area=13&first=1&ss_first=1&ts=1786812755&mcr=b3e8852e7293f80e08d0514614832ca9&sc_i=shopping-pc-web-ranking-suggest-h_srch-srchbtn-sgstfrom-ranking-kwditem-h_srch-srchbox&sretry=0" target="_blank" rel="noopener noreferrer" class="hig-button gift-button">
                    🎁 母さんにギフトを送る
                </a>
            </div>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="toast">メッセージ</div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
